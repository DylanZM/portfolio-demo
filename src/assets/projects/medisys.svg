<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c778dd"/>
      <stop offset="1" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c778dd" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9d4edd" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#0b0d0e"/>
  <rect width="1200" height="600" fill="url(#bgGlow)"/>
  <circle cx="980" cy="120" r="220" fill="#c778dd" opacity="0.06"/>
  <circle cx="120" cy="520" r="180" fill="#9d4edd" opacity="0.06"/>

  <!-- Top nav -->
  <rect x="60" y="34" width="30" height="30" rx="8" fill="url(#primaryGrad)"/>
  <path d="M67 49 v-9 l5 4 5-4 v9" fill="none" stroke="#0b0d0e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="55" fill="#f3f4f6" font-size="19" font-weight="700">MediSys</text>
  <g fill="#abb2bf" font-size="13.5">
    <text x="820" y="54">Inicio</text>
    <text x="900" y="54">Funciones</text>
    <text x="990" y="54">Precios</text>
    <text x="1070" y="54">Contacto</text>
  </g>
  <rect x="1118" y="38" width="92" height="32" rx="16" fill="url(#primaryGrad)"/>
  <text x="1164" y="59" fill="#0b0d0e" font-size="12.5" font-weight="700" text-anchor="middle">Demo</text>

  <!-- Hero text -->
  <text x="80" y="210" fill="#f3f4f6" font-size="46" font-weight="800">Gestión clínica</text>
  <text x="80" y="266" fill="#f3f4f6" font-size="46" font-weight="800">simp<tspan fill="#c778dd">le</tspan> y moderna</text>
  <text x="80" y="312" fill="#abb2bf" font-size="17">El sistema todo-en-uno para clínicas y hospitales:</text>
  <text x="80" y="338" fill="#abb2bf" font-size="17">pacientes, citas y personal en un solo lugar.</text>

  <!-- CTA buttons -->
  <rect x="80" y="372" width="168" height="46" rx="12" fill="url(#primaryGrad)"/>
  <text x="164" y="400" fill="#0b0d0e" font-size="15" font-weight="700" text-anchor="middle">Comenzar ahora</text>
  <rect x="264" y="372" width="168" height="46" rx="12" fill="none" stroke="#c778dd" stroke-width="1.6"/>
  <text x="348" y="400" fill="#c778dd" font-size="15" font-weight="600" text-anchor="middle">Ver demo</text>

  <!-- Feature pills -->
  <g font-size="12.5">
    <rect x="80" y="446" width="150" height="34" rx="17" fill="#141618"/>
    <circle cx="102" cy="463" r="5" fill="#5fd39b"/>
    <text x="116" y="468" fill="#abb2bf">Historiales</text>

    <rect x="244" y="446" width="140" height="34" rx="17" fill="#141618"/>
    <circle cx="266" cy="463" r="5" fill="#c778dd"/>
    <text x="280" y="468" fill="#abb2bf">Citas</text>

    <rect x="396" y="446" width="150" height="34" rx="17" fill="#141618"/>
    <circle cx="418" cy="463" r="5" fill="#5fd39b"/>
    <text x="432" y="468" fill="#abb2bf">Personal</text>
  </g>

  <!-- App preview window (presentation, no data) -->
  <rect x="700" y="150" width="420" height="300" rx="18" fill="#141618" stroke="#abb2bf" stroke-opacity="0.12"/>
  <rect x="700" y="150" width="420" height="40" rx="18" fill="#1b1f22"/>
  <rect x="700" y="176" width="420" height="14" fill="#1b1f22"/>
  <circle cx="724" cy="170" r="5" fill="#ff5f56"/>
  <circle cx="742" cy="170" r="5" fill="#ffbd2e"/>
  <circle cx="760" cy="170" r="5" fill="#27c93f"/>
  <text x="820" y="175" fill="#abb2bf" font-size="11.5" text-anchor="middle">app.medisys.health</text>

  <!-- Abstract UI inside preview -->
  <rect x="722" y="210" width="150" height="14" rx="7" fill="#c778dd" opacity="0.5"/>
  <rect x="722" y="234" width="220" height="9" rx="4.5" fill="#abb2bf" opacity="0.25"/>
  <rect x="722" y="250" width="190" height="9" rx="4.5" fill="#abb2bf" opacity="0.18"/>

  <rect x="722" y="280" width="120" height="68" rx="12" fill="#0b0d0e" stroke="#c778dd" stroke-opacity="0.25"/>
  <rect x="738" y="298" width="40" height="8" rx="4" fill="#c778dd" opacity="0.6"/>
  <rect x="738" y="314" width="70" height="14" rx="4" fill="#f3f4f6" opacity="0.85"/>
  <rect x="738" y="334" width="52" height="6" rx="3" fill="#5fd39b" opacity="0.7"/>

  <rect x="858" y="280" width="120" height="68" rx="12" fill="#0b0d0e" stroke="#abb2bf" stroke-opacity="0.18"/>
  <rect x="874" y="298" width="40" height="8" rx="4" fill="#c778dd" opacity="0.6"/>
  <rect x="874" y="314" width="70" height="14" rx="4" fill="#f3f4f6" opacity="0.85"/>
  <rect x="874" y="334" width="52" height="6" rx="3" fill="#5fd39b" opacity="0.7"/>

  <rect x="722" y="364" width="256" height="64" rx="12" fill="#0b0d0e" stroke="#abb2bf" stroke-opacity="0.18"/>
  <rect x="738" y="382" width="120" height="9" rx="4.5" fill="#abb2bf" opacity="0.3"/>
  <rect x="738" y="400" width="200" height="9" rx="4.5" fill="#abb2bf" opacity="0.18"/>
  <rect x="738" y="416" width="160" height="9" rx="4.5" fill="#abb2bf" opacity="0.12"/>
</svg>
